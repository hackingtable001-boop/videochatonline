<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Видеочат</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--text:#2b2b2b;--muted:#77726a;--accent:#3d6b8c;--danger:#b5473f;--line:#dcd8cf}
@media (prefers-color-scheme:dark){:root{--bg:#1f2124;--card:#2a2d31;--text:#e8e6e1;--muted:#9a9790;--accent:#6c9cbf;--danger:#c9615a;--line:#3a3e43}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
main{max-width:960px;margin:0 auto;padding:20px}
h1{font-size:22px;font-weight:600;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.videos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.videos{grid-template-columns:1fr}}
.tile{position:relative;background:#26282b;border-radius:12px;overflow:hidden;aspect-ratio:4/3}
.tile video{width:100%;height:100%;object-fit:cover;background:#26282b}
.tile span{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;padding:3px 10px;border-radius:8px;font-size:13px}
#me video{transform:scaleX(-1)}
.wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#a9a69f;font-size:14px;text-align:center;padding:20px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 16px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{background:var(--danger);border-color:var(--danger);color:#fff}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
textarea{width:100%;height:80px;font:12px ui-monospace,monospace;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);resize:vertical}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px}
.hint{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 8px}
.hidden{display:none}
#status{color:var(--muted);font-size:14px;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>Видеочат на двоих</h1>

<div class="card">
  <div class="videos">
    <div class="tile" id="me"><video id="local" autoplay playsinline muted></video><span>Вы</span></div>
    <div class="tile"><video id="remote" autoplay playsinline></video><div class="wait" id="wait">Ждём друга…</div><span>Друг</span></div>
  </div>
  <div class="row" id="controls">
    <button class="primary" id="start">Включить камеру</button>
    <button id="mic" class="hidden">Микрофон: вкл</button>
    <button id="cam" class="hidden">Камера: вкл</button>
    <button id="hang" class="danger hidden">Завершить</button>
  </div>
  <div id="status"></div>
</div>

<div class="card hidden" id="connect">
  <p class="hint">Соединение идёт напрямую между вами, без сервера. Нужно один раз обменяться двумя короткими кодами (например, через Telegram).</p>
  <div class="row">
    <button id="create">Я создаю комнату</button>
    <button id="join">Я подключаюсь к другу</button>
  </div>

  <div id="hostBox" class="hidden">
    <label>1. Отправьте этот код другу:</label>
    <textarea id="offerOut" readonly></textarea>
    <div class="row"><button data-copy="offerOut">Скопировать</button></div>
    <label>2. Вставьте сюда ответный код от друга:</label>
    <textarea id="answerIn"></textarea>
    <div class="row"><button class="primary" id="finish">Соединить</button></div>
  </div>

  <div id="guestBox" class="hidden">
    <label>1. Вставьте код, который прислал друг:</label>
    <textarea id="offerIn"></textarea>
    <div class="row"><button class="primary" id="makeAnswer">Получить ответный код</button></div>
    <div id="answerBlock" class="hidden">
      <label>2. Отправьте этот код обратно другу:</label>
      <textarea id="answerOut" readonly></textarea>
      <div class="row"><button data-copy="answerOut">Скопировать</button></div>
    </div>
  </div>
</div>
</main>

<script>
const $ = id => document.getElementById(id);
const cfg = {iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
let stream, pc;

const enc = d => btoa(JSON.stringify(d));
const dec = s => JSON.parse(atob(s.trim()));
const status = t => $('status').textContent = t;

function newPC(){
  pc = new RTCPeerConnection(cfg);
  stream.getTracks().forEach(t => pc.addTrack(t, stream));
  pc.ontrack = e => { $('remote').srcObject = e.streams[0]; $('wait').classList.add('hidden'); };
  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === 'connected') { status('Друг подключён'); $('connect').classList.add('hidden'); }
    if (s === 'disconnected' || s === 'failed') { status('Соединение потеряно'); $('wait').classList.remove('hidden'); $('wait').textContent = 'Соединение потеряно'; }
  };
  return pc;
}
function gathered(){
  return new Promise(res => {
    if (pc.iceGatheringState === 'complete') return res();
    pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') res(); });
    setTimeout(res, 4000);
  });
}

$('start').onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
  } catch (e) { status('Не удалось включить камеру: разрешите доступ к камере и микрофону.'); return; }
  $('local').srcObject = stream;
  $('start').classList.add('hidden');
  ['mic','cam','hang'].forEach(i => $(i).classList.remove('hidden'));
  $('connect').classList.remove('hidden');
  status('Камера включена. Теперь соединитесь с другом.');
};

$('create').onclick = async () => {
  $('guestBox').classList.add('hidden'); $('hostBox').classList.remove('hidden');
  newPC();
  await pc.setLocalDescription(await pc.createOffer());
  status('Готовим код…');
  await gathered();
  $('offerOut').value = enc(pc.localDescription);
  status('Отправьте код другу и дождитесь ответного.');
};
$('finish').onclick = async () => {
  try { await pc.setRemoteDescription(dec($('answerIn').value)); status('Соединяемся…'); }
  catch { status('Код не подошёл. Проверьте, что скопировали его целиком.'); }
};

$('join').onclick = () => { $('hostBox').classList.add('hidden'); $('guestBox').classList.remove('hidden'); };
$('makeAnswer').onclick = async () => {
  try {
    newPC();
    await pc.setRemoteDescription(dec($('offerIn').value));
    await pc.setLocalDescription(await pc.createAnswer());
    status('Готовим ответный код…');
    await gathered();
    $('answerOut').value = enc(pc.localDescription);
    $('answerBlock').classList.remove('hidden');
    status('Отправьте ответный код другу.');
  } catch { status('Код не подошёл. Проверьте, что скопировали его целиком.'); }
};

document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
  const t = $(b.dataset.copy); t.select();
  try { await navigator.clipboard.writeText(t.value); } catch { document.execCommand('copy'); }
  b.textContent = 'Скопировано';
  setTimeout(() => b.textContent = 'Скопировать', 1500);
});

$('mic').onclick = () => {
  const t = stream.getAudioTracks()[0]; t.enabled = !t.enabled;
  $('mic').textContent = 'Микрофон: ' + (t.enabled ? 'вкл' : 'выкл');
};
$('cam').onclick = () => {
  const t = stream.getVideoTracks()[0]; t.enabled = !t.enabled;
  $('cam').textContent = 'Камера: ' + (t.enabled ? 'вкл' : 'выкл');
};
$('hang').onclick = () => location.reload();
</script>
</body>
</html>
